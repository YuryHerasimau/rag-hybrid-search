[project]
name = "rag-hybrid-search"
version = "0.1.0"
description = "Enterprise RAG: гибридный поиск, grounded-ответы, evaluation в CI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.7",
]

# Зависимости ставим по фазам, чтобы не тянуть тяжёлый ML на слабый CPU-ноут
# раньше времени. Установка: uv sync --group phase1
[dependency-groups]
phase1 = [
    "llama-index-core>=0.11",
    "llama-index-embeddings-huggingface>=0.3",
    "llama-index-vector-stores-qdrant>=0.3",
    "llama-index-llms-anthropic>=0.3",
    # 1.19 убрал IDF_EMBEDDING_MODELS, который импортит llama-index-vector-stores-qdrant 0.10
    "qdrant-client>=1.16,<1.19",
    "sentence-transformers>=3.0",
]
eval = [
    "ragas>=0.2",
    "datasets>=2.19",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
